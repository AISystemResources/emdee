<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- SPRINT-150c: favicon. Miniature brain silhouette in the Cerebral palette.
       Designed to be recognisable at 16×16 — thick strokes, one accent color,
       one clear negative-space "brain" shape. -->
  <rect width="32" height="32" rx="6" fill="#FFF6F8"/>
  <path
    d="M 10 9
       C 7 9, 5 11, 5 14
       C 5 16, 6 17.5, 7.5 18.5
       C 7.5 20.5, 9 22, 11 22
       C 12 23.5, 15 24, 16 22.5
       C 17 24, 20 23.5, 21 22
       C 23 22, 24.5 20.5, 24.5 18.5
       C 26 17.5, 27 16, 27 14
       C 27 11, 25 9, 22 9
       C 21 7.5, 19 7, 17.5 8
       C 16.5 7, 15.5 7, 16 8
       C 16.5 7, 15.5 7, 14.5 8
       C 13 7, 11 7.5, 10 9 Z"
    fill="none"
    stroke="#1A0E15"
    stroke-width="1.3"
    stroke-linejoin="round"
  />
  <!-- Central fissure in Cerebral Pink -->
  <path
    d="M 16 9 C 16 13, 15.5 17, 16 22"
    fill="none"
    stroke="#FF3D6E"
    stroke-width="1.6"
    stroke-linecap="round"
  />
</svg>
