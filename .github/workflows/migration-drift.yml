# ── Migration drift guard (SPRINT-046, ported from DOUBLELEAD sprint-011) ──
# Fails the PR if `supabase/migrations/*.sql` has files that aren't yet in
# `supabase_migrations.schema_migrations`. The list of "expected drift"
# (already-applied-under-different-name or shelved-feature migrations) is
# maintained in `supabase/migrations/.drift-ignore`.
#
# Checks BOTH EMDEE-prod and EMDEE-test (extended SPRINT-047 follow-up):
# SPRINT-047 discovered that test had silently drifted 17 migrations behind
# prod. Watching only prod hid the asymmetry until e2e exploded.

name: migration-drift

on:
  # Runs on every PR / push to main so the required-check contract on
  # `main` always gets a reported status. A path filter here would leave
  # non-migration PRs with a permanent "Expected — Waiting for status"
  # since GitHub never reports skipped/filtered checks. The job
  # short-circuits internally when the diff doesn't touch migrations.
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check-drift:
    name: check-drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Prod check — original SPRINT-046 behaviour.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Test check — script automatically includes EMDEE-test when these
      # are present. Either project drifting fails the check.
      SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
      SUPABASE_TEST_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect migration-relevant changes
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            changed=$(git diff --name-only "$base" "$head")
          else
            changed=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" || git show --name-only --pretty=format: "${{ github.sha }}")
          fi
          echo "changed files:"
          echo "$changed"
          if echo "$changed" | grep -qE '^(supabase/migrations/|scripts/check-migration-drift\.mjs$|\.github/workflows/migration-drift\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No migration-relevant changes — skipping drift check (reporting success)."
          fi

      - name: Setup Node
        if: steps.filter.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Run migration-drift check
        if: steps.filter.outputs.run == 'true'
        run: node scripts/check-migration-drift.mjs
